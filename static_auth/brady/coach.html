<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Coach | Level Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brady.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>AI Coach</h1>
      <p>Clear daily plan based on your saved work.</p>
      <div class="shell-meta">
        <span class="sync-chip">Saved</span>
      </div>
    </div>

    <div id="alert" class="alert" style="display:none;"></div>

    <div class="section">
      <h2>Today's Plan</h2>
      <div id="coachMeta" class="small">Loading...</div>
      <div class="btn-row">
        <button class="btn" type="button" id="refreshPlanBtn">Get plan</button>
        <button class="btn secondary" type="button" id="forcePlanBtn">Refresh plan</button>
      </div>
      <div id="planContainer" style="margin-top:12px;">Loading...</div>
    </div>

    <div class="section">
      <h2>Coach Memory</h2>
      <div class="small">This saves your goal, session time, and context so coaching stays consistent.</div>

      <div class="ai-box" style="margin-top:12px;">
        <h4>Manual Inputs</h4>
        <div class="field-row">
          <div>
            <label for="manualGoal">Main goal</label>
            <input id="manualGoal" type="text" placeholder="Example: Improve fractions and consistency">
          </div>
          <div>
            <label for="manualSessionMinutes">Session length (minutes)</label>
            <input id="manualSessionMinutes" type="number" min="5" max="120" step="5" placeholder="Example: 25">
          </div>
          <div>
            <label for="manualTone">Coaching tone</label>
            <select id="manualTone">
              <option value="direct">Direct</option>
              <option value="encouraging">Encouraging</option>
              <option value="challenging">Challenging</option>
            </select>
          </div>
          <div>
            <label for="manualNotes">Notes</label>
            <textarea id="manualNotes" placeholder="Share schedule limits, motivators, or reminders."></textarea>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn secondary" type="button" id="saveManualBtn">Save inputs</button>
        </div>
        <div id="manualSaveMsg" class="small" style="margin-top:8px;"></div>
      </div>

      <div class="ai-box" style="margin-top:12px;">
        <h4>Saved Profile Snapshot</h4>
        <div id="profileContainer" class="small">Loading...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sync_status.js"></script>
  <script src="../js/brady_access.js"></script>
  <script src="../js/brady_nav.js"></script>
  <script src="../js/brady_coach.js"></script>
</body>
</html>
