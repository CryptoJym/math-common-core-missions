<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments | Level Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brady.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Assignments</h1>
      <p>Start with one clear mission. Open details only when you need them.</p>
      <div class="shell-meta">
        <span class="sync-chip">Saved</span>
        <span class="small">Status labels: Not started, Working, Mastered</span>
      </div>
    </div>

    <div id="alert" class="alert" style="display:none;"></div>

    <div class="section">
      <h2>Filters</h2>
      <div class="btn-row">
        <button class="btn secondary" type="button" data-filter="all">All</button>
        <button class="btn secondary" type="button" data-filter="math">Math</button>
        <button class="btn secondary" type="button" data-filter="reading">Reading</button>
        <button class="btn secondary" type="button" data-filter="language">Language</button>
      </div>
      <div class="small" style="margin-top:8px;">Tip: keep just one assignment in Working so Daily stays focused.</div>
    </div>

    <div id="nextUpPanel" class="section assignment-nextup">
      <h2>Next Up</h2>
      <div class="small">Loading next assignment...</div>
    </div>

    <div id="assignmentList" class="assignment-compact-list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/brady_access.js"></script>
  <script src="../js/brady_nav.js"></script>
  <script src="../js/brady_assignments.js"></script>
  <script src="../js/brady_assignments_ui.js"></script>
</body>
</html>
