<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brady Assignments | Math Hunter Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brady.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Assignments</h1>
      <p>Work the exact skills you’re missing, then mark progress</p>
    </div>

    <div id="alert" class="alert" style="display:none;"></div>

    <div class="section">
      <h2>Filters</h2>
      <div class="btn-row">
        <button class="btn secondary" type="button" data-filter="all">All</button>
        <button class="btn secondary" type="button" data-filter="math">Math</button>
        <button class="btn secondary" type="button" data-filter="reading">Reading</button>
        <button class="btn secondary" type="button" data-filter="language">Language</button>
      </div>
      <div class="small" style="margin-top:10px;">
        Tip: set a few to <span class="mono">in_progress</span>, and let Daily Training pick the next one automatically.
      </div>
    </div>

    <div id="assignmentList"></div>

    <div class="section">
      <h2>Back</h2>
      <div class="btn-row">
        <a class="btn secondary" href="index.html" style="text-decoration:none; display:inline-flex; align-items:center;">← Brady HQ</a>
        <a class="btn secondary" href="../index.html" style="text-decoration:none; display:inline-flex; align-items:center;">🏰 Main HQ</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/brady_access.js"></script>
  <script src="../js/brady_assignments.js"></script>
  <script src="../js/brady_assignments_ui.js"></script>
</body>
</html>
