<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Up | Access Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-soft: #111725;
      --line: rgba(77, 202, 239, 0.32);
      --line-soft: rgba(255, 255, 255, 0.14);
      --blue: #4cc9f0;
      --purple: #7b2cbf;
      --gold: #ffd700;
      --green: #00ff88;
      --red: #ff4444;
      --text: #e7f0ff;
      --muted: #96aac9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(123, 44, 191, 0.2) 0%, transparent 42%),
        radial-gradient(circle at 90% 90%, rgba(76, 201, 240, 0.2) 0%, transparent 42%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 45%, #000 35%, transparent 88%);
      pointer-events: none;
      z-index: -1;
    }

    .auth-shell {
      width: min(460px, 100%);
    }

    .auth-card {
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(155deg, rgba(10, 18, 32, 0.9), rgba(13, 19, 33, 0.92));
      box-shadow: 0 20px 42px rgba(2, 8, 16, 0.5);
      padding: 30px 24px;
      backdrop-filter: blur(10px);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.14em;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255, 215, 0, 0.25);
    }

    .brand p {
      margin-top: 8px;
      color: var(--blue);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .auth-error,
    .auth-success {
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
      font-size: 0.95rem;
    }

    .auth-error {
      border: 1px solid rgba(255, 68, 68, 0.6);
      background: rgba(255, 68, 68, 0.1);
      color: var(--red);
    }

    .auth-success {
      border: 1px solid rgba(0, 255, 136, 0.5);
      background: rgba(0, 255, 136, 0.08);
      color: var(--green);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: 11px;
      background: rgba(4, 8, 15, 0.78);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      padding: 11px 12px;
    }

    .field input:focus {
      outline: none;
      border-color: rgba(0, 255, 136, 0.64);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
    }

    .field input::placeholder {
      color: var(--muted);
    }

    .auth-btn,
    .auth-secondary-btn {
      width: 100%;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.76rem;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .auth-btn {
      background: linear-gradient(135deg, #0ce08a, #00ff88);
      color: #04110a;
      margin-top: 8px;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.24);
    }

    .auth-secondary-btn {
      margin-top: 10px;
      background: rgba(76, 201, 240, 0.1);
      border-color: rgba(76, 201, 240, 0.42);
      color: var(--blue);
    }

    .auth-btn:hover,
    .auth-secondary-btn:hover {
      transform: translateY(-1px);
    }

    .auth-btn:disabled,
    .auth-secondary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .auth-links {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }

    .auth-links a,
    .guest-link {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    .auth-links a:hover,
    .guest-link:hover {
      text-decoration: underline;
    }

    .guest-link {
      margin-top: 10px;
      display: inline-block;
      color: #a7bbd3;
      font-size: 0.92rem;
    }

    .auth-text-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .auth-text-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <h1>Level Up</h1>
        <p>System Authentication Required</p>
      </div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Access Key</label>
          <input type="password" id="password" placeholder="Enter your password" required minlength="6">
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">Log In</button>
      </form>

      <button type="button" class="auth-secondary-btn" id="resendBtn" onclick="handleResendConfirmation()">
        Resend Confirmation Email
      </button>

      <div class="auth-links">
        <p>Need an account? <a id="signupLink" href="signup.html">Create one</a></p>
        <button type="button" class="auth-text-btn" id="forgotPasswordBtn" onclick="handlePasswordReset()">Forgot password?</button>
      </div>

      <a href="index.html" class="guest-link">Continue as guest (progress is not saved)</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const url = new URL(window.location.href);
      const safeNext = (raw) => {
        const value = (raw || '').trim();
        if (!value) return '';
        if (value.includes('://') || value.startsWith('//')) return '';
        if (value.toLowerCase().startsWith('javascript:')) return '';
        return value;
      };
      const next = safeNext(url.searchParams.get('next'));
      const signupLink = document.getElementById('signupLink');
      if (signupLink && next) {
        signupLink.href = `signup.html?next=${encodeURIComponent(next)}`;
      }

      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const redirectState = await MHA_Auth.processAuthRedirect();

      if (redirectState.error) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(redirectState.error, 'login');
        errorEl.style.display = 'block';
      } else if (redirectState.confirmed) {
        successEl.textContent = 'Email confirmed. You can sign in now.';
        successEl.style.display = 'block';
      } else if (url.searchParams.get('reset') === '1') {
        successEl.textContent = 'Password updated. You can sign in now.';
        successEl.style.display = 'block';
      }

      MHA_Auth.clearAuthRedirectParams();
      const session = await MHA_Auth.getSession();
      if (session) {
        window.location.href = next || 'index.html';
      }
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const btn = document.getElementById('submitBtn');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entering...';

      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        await MHA_Auth.signIn(email, password);
        const url = new URL(window.location.href);
        const rawNext = url.searchParams.get('next');
        const next = (rawNext && !rawNext.includes('://') && !rawNext.startsWith('//')) ? rawNext : '';
        window.location.href = next || 'index.html';
      } catch (err) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(err, 'login');
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    }

    async function handleResendConfirmation() {
      const email = document.getElementById('email').value.trim();
      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const btn = document.getElementById('resendBtn');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (!email) {
        errorEl.textContent = 'Enter your email above, then click resend.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        await MHA_Auth.resendSignupConfirmation(email);
        successEl.textContent = 'Confirmation email sent. Check inbox or spam, then sign in.';
        successEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(err, 'resend');
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Resend Confirmation Email';
      }
    }

    async function handlePasswordReset() {
      const email = document.getElementById('email').value.trim();
      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const btn = document.getElementById('forgotPasswordBtn');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (!email) {
        errorEl.textContent = 'Enter your email above, then click Forgot password.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending reset link...';
      try {
        await MHA_Auth.requestPasswordReset(email);
        successEl.textContent = 'If this email is registered, a password reset link has been sent. Check inbox and spam.';
        successEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(err, 'reset');
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Forgot password?';
      }
    }
  </script>
</body>
</html>
