<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment | Level Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brady.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1 id="assignmentTitle">Assignment</h1>
      <p id="assignmentSubtitle">Test, review, and save your progress.</p>
      <div class="shell-meta">
        <span class="sync-chip">Saved</span>
      </div>
    </div>

    <div id="alert" class="alert" style="display:none;"></div>

    <div id="assignmentMeta" class="section" style="display:none;"></div>
    <div id="attemptHistory" class="section" style="display:none;"></div>
    <div id="quizContainer" class="section">
      <h2>Loading...</h2>
    </div>
    <div id="resultsContainer" class="section" style="display:none;"></div>
    <div id="practiceContainer" class="section" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/brady_access.js"></script>
  <script src="../js/brady_nav.js"></script>
  <script src="../js/brady_assignments.js"></script>
  <script src="../js/brady_quiz_bank.js"></script>
  <script src="../js/brady_assignment_runner.js"></script>
</body>
</html>
