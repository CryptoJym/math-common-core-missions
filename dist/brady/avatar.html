<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Dashboard | Level Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brady.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Progress Dashboard</h1>
      <p>Standing, momentum, and next focus in one view.</p>
      <div class="shell-meta">
        <span class="sync-chip">Saved</span>
      </div>
    </div>

    <div id="alert" class="alert" style="display:none;"></div>

    <div class="section">
      <h2>Profile</h2>
      <div id="identitySection" class="small">Loading...</div>
      <div id="standingSection" class="small" style="margin-top:12px;">Calculating standing...</div>
    </div>

    <div class="section">
      <h2>Assignment Progress</h2>
      <div id="assignmentSection">Loading...</div>
    </div>

    <div class="section">
      <h2>Momentum</h2>
      <div class="grid" style="margin-bottom:0;">
        <div id="dailyMomentumCard" class="section" style="margin:0;">
          <h2>Daily Momentum</h2>
          <div class="small">Loading...</div>
        </div>
        <div id="readingMomentumCard" class="section" style="margin:0;">
          <h2>Reading Momentum</h2>
          <div class="small">Loading...</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Performance Snapshot</h2>
      <div id="performanceSection">Loading...</div>
    </div>

    <div class="section">
      <h2>Next Focus</h2>
      <div id="nextStepsSection">Loading...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sync_status.js"></script>
  <script src="../js/brady_access.js"></script>
  <script src="../js/brady_nav.js"></script>
  <script src="../js/brady_assignments.js"></script>
  <script src="../js/brady_avatar.js"></script>
</body>
</html>
