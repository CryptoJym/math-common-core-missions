<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading | Level Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brady.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>Reading</h1>
      <p>Read. Answer. Reflect.</p>
      <div class="shell-meta">
        <span class="sync-chip">Saved</span>
        <span class="small">Write one short reflection so progress stays meaningful.</span>
      </div>
    </div>

    <div id="alert" class="alert" style="display:none;"></div>

    <div class="section">
      <h2>Today</h2>
      <div class="field-row">
        <div>
          <label for="day">Date</label>
          <input id="day" type="date">
        </div>
        <div>
          <label for="book">Book</label>
          <select id="book"></select>
        </div>
        <div>
          <label for="minutes">Minutes</label>
          <input id="minutes" type="number" min="0" max="600" step="5" placeholder="Example: 20">
        </div>
        <div>
          <label for="journal">Reflection</label>
          <textarea id="journal" placeholder="What did you read? What was the main idea? What should you remember tomorrow?"></textarea>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" type="button" id="saveReading">Save</button>
        <button class="btn secondary" type="button" id="fillWorksheet">Open worksheet</button>
        <button class="btn secondary" type="button" id="aiCheckWorksheet">Check worksheet</button>
        <button class="btn secondary" type="button" id="fillPrompt">AI prompt</button>
        <span class="small" id="draftMsg"></span>
      </div>

      <div class="ai-box" id="worksheetReviewBox" style="display:none; margin-top:12px;">
        <h4>Worksheet Review</h4>
        <div id="worksheetReviewMeta" class="small"></div>
        <div id="worksheetReviewFeedback" class="small" style="margin-top:10px; white-space:pre-wrap;"></div>
        <div id="worksheetReviewNextSteps" class="small" style="margin-top:10px;"></div>
      </div>

      <div class="ai-box" id="aiBox" style="display:none;">
        <h4>AI Help Prompts</h4>
        <div class="small">Choose one tool and copy the prompt.</div>

        <div style="margin-top:10px;">
          <label for="chatgptPrompt">ChatGPT prompt</label>
          <textarea class="ai-prompt" id="chatgptPrompt" readonly></textarea>
          <div class="btn-row">
            <button class="btn secondary" type="button" data-copy="chatgptPrompt">Copy</button>
          </div>
        </div>

        <div style="margin-top:12px;">
          <label for="codexPrompt">Codex prompt</label>
          <textarea class="ai-prompt" id="codexPrompt" readonly></textarea>
          <div class="btn-row">
            <button class="btn secondary" type="button" data-copy="codexPrompt">Copy</button>
          </div>
        </div>

        <div style="margin-top:12px;">
          <label for="claudePrompt">Claude Code prompt</label>
          <textarea class="ai-prompt" id="claudePrompt" readonly></textarea>
          <div class="btn-row">
            <button class="btn secondary" type="button" data-copy="claudePrompt">Copy</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>History</h2>
      <div id="readingSummary" class="small">Loading...</div>
      <table class="table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Book</th>
            <th>Minutes</th>
            <th>Reflection</th>
          </tr>
        </thead>
        <tbody id="readingRows"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/brady_access.js"></script>
  <script src="../js/brady_nav.js"></script>
  <script src="../js/brady_reading.js"></script>
</body>
</html>
