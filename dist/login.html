<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Up Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #141a2b;
      --accent-blue: #4cc9f0;
      --accent-purple: #7b2cbf;
      --accent-gold: #ffd700;
      --accent-green: #00ff88;
      --accent-red: #ff4444;
      --text-primary: #eaf2ff;
      --text-secondary: #aab8d5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      font-family: 'Rajdhani', sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(circle at 8% -10%, rgba(123, 44, 191, 0.25), transparent 42%),
        radial-gradient(circle at 95% 0%, rgba(76, 201, 240, 0.22), transparent 42%),
        var(--bg-primary);
    }

    .auth-container {
      width: min(460px, 100%);
    }

    .auth-card {
      border-radius: 22px;
      border: 1px solid rgba(76, 201, 240, 0.35);
      background: linear-gradient(145deg, rgba(21, 26, 44, 0.96), rgba(13, 17, 30, 0.96));
      box-shadow: 0 18px 38px rgba(4, 8, 20, 0.5);
      padding: 30px 24px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-header h1 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-gold);
      font-size: 1.6em;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(255, 215, 0, 0.28);
    }

    .auth-header p {
      margin-top: 7px;
      color: var(--accent-blue);
      letter-spacing: 0.9px;
      font-size: 0.97em;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--accent-blue);
      font-size: 0.84em;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(7, 10, 17, 0.75);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1em;
      padding: 12px 12px;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(76, 201, 240, 0.62);
      box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.14);
    }

    .form-group input::placeholder {
      color: var(--text-secondary);
    }

    .auth-btn,
    .auth-secondary-btn {
      width: 100%;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85em;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .auth-btn {
      margin-top: 8px;
      background: linear-gradient(135deg, #0ce08a, #00ff88);
      color: #04110a;
    }

    .auth-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 18px rgba(0, 255, 136, 0.24);
    }

    .auth-btn:disabled,
    .auth-secondary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .auth-secondary-btn {
      margin-top: 10px;
      background: rgba(76, 201, 240, 0.12);
      border-color: rgba(76, 201, 240, 0.48);
      color: var(--accent-blue);
    }

    .auth-secondary-btn:hover {
      box-shadow: 0 0 15px rgba(76, 201, 240, 0.24);
    }

    .auth-error,
    .auth-success {
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
      font-size: 0.95em;
    }

    .auth-error {
      border: 1px solid rgba(255, 68, 68, 0.65);
      background: rgba(255, 68, 68, 0.12);
      color: var(--accent-red);
    }

    .auth-success {
      border: 1px solid rgba(0, 255, 136, 0.6);
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-green);
    }

    .auth-links {
      margin-top: 14px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.97em;
    }

    .auth-links a,
    .guest-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-links a:hover,
    .guest-link:hover {
      text-decoration: underline;
    }

    .guest-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.92em;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Level Up Login</h1>
        <p>Sign in to continue your plan</p>
      </div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required minlength="6">
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">Enter the Gate</button>
      </form>

      <button type="button" class="auth-secondary-btn" id="resendBtn" onclick="handleResendConfirmation()">
        Resend confirmation email
      </button>

      <div class="auth-links">
        <p>Need an account? <a id="signupLink" href="signup.html">Create one</a></p>
      </div>

      <a href="index.html" class="guest-link">Continue as guest (progress is not saved)</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const url = new URL(window.location.href);
      const safeNext = (raw) => {
        const value = (raw || '').trim();
        if (!value) return '';
        if (value.includes('://') || value.startsWith('//')) return '';
        if (value.toLowerCase().startsWith('javascript:')) return '';
        return value;
      };
      const next = safeNext(url.searchParams.get('next'));
      const signupLink = document.getElementById('signupLink');
      if (signupLink && next) {
        signupLink.href = `signup.html?next=${encodeURIComponent(next)}`;
      }

      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const redirectState = await MHA_Auth.processAuthRedirect();

      if (redirectState.error) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(redirectState.error, 'login');
        errorEl.style.display = 'block';
      } else if (redirectState.confirmed) {
        successEl.textContent = 'Email confirmed. You can sign in now.';
        successEl.style.display = 'block';
      }

      MHA_Auth.clearAuthRedirectParams();
      const session = await MHA_Auth.getSession();
      if (session) {
        window.location.href = next || 'index.html';
      }
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const btn = document.getElementById('submitBtn');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entering...';

      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        await MHA_Auth.signIn(email, password);
        const url = new URL(window.location.href);
        const rawNext = url.searchParams.get('next');
        const next = (rawNext && !rawNext.includes('://') && !rawNext.startsWith('//')) ? rawNext : '';
        window.location.href = next || 'index.html';
      } catch (err) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(err, 'login');
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Enter the Gate';
      }
    }

    async function handleResendConfirmation() {
      const email = document.getElementById('email').value.trim();
      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const btn = document.getElementById('resendBtn');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (!email) {
        errorEl.textContent = 'Enter your email above, then click resend.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        await MHA_Auth.resendSignupConfirmation(email);
        successEl.textContent = 'Confirmation email sent. Check inbox or spam, then sign in.';
        successEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(err, 'resend');
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Resend confirmation email';
      }
    }
  </script>
</body>
</html>
