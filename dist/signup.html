<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Level Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #141a2b;
      --accent-blue: #4cc9f0;
      --accent-purple: #7b2cbf;
      --accent-gold: #ffd700;
      --accent-green: #00ff88;
      --accent-red: #ff4444;
      --text-primary: #eaf2ff;
      --text-secondary: #aab8d5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      font-family: 'Rajdhani', sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(circle at 8% -10%, rgba(123, 44, 191, 0.25), transparent 42%),
        radial-gradient(circle at 95% 0%, rgba(76, 201, 240, 0.22), transparent 42%),
        var(--bg-primary);
    }

    .auth-container {
      width: min(460px, 100%);
    }

    .auth-card {
      border-radius: 22px;
      border: 1px solid rgba(76, 201, 240, 0.35);
      background: linear-gradient(145deg, rgba(21, 26, 44, 0.96), rgba(13, 17, 30, 0.96));
      box-shadow: 0 18px 38px rgba(4, 8, 20, 0.5);
      padding: 30px 24px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-header h1 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-gold);
      font-size: 1.5em;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(255, 215, 0, 0.28);
    }

    .auth-header p {
      margin-top: 7px;
      color: var(--accent-blue);
      letter-spacing: 0.9px;
      font-size: 0.97em;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--accent-blue);
      font-size: 0.84em;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      background: rgba(7, 10, 17, 0.75);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 1em;
      padding: 12px 12px;
    }

    .form-group input:focus {
      outline: none;
      border-color: rgba(76, 201, 240, 0.62);
      box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.14);
    }

    .form-group input::placeholder {
      color: var(--text-secondary);
    }

    .auth-btn {
      width: 100%;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85em;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      margin-top: 8px;
      background: linear-gradient(135deg, #0ce08a, #00ff88);
      color: #04110a;
    }

    .auth-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 18px rgba(0, 255, 136, 0.24);
    }

    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .auth-error,
    .auth-success {
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
      font-size: 0.95em;
    }

    .auth-error {
      border: 1px solid rgba(255, 68, 68, 0.65);
      background: rgba(255, 68, 68, 0.12);
      color: var(--accent-red);
    }

    .auth-success {
      border: 1px solid rgba(0, 255, 136, 0.6);
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-green);
    }

    .auth-links {
      margin-top: 14px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.97em;
    }

    .auth-links a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Your Account</h1>
        <p>Set up Level Up access</p>
      </div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="displayName">Display name</label>
          <input type="text" id="displayName" placeholder="How should we call you?" required minlength="2" maxlength="30">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required minlength="6">
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">Create account</button>
      </form>

      <div class="auth-links">
        <p>Already have an account? <a id="loginLink" href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const url = new URL(window.location.href);
      const safeNext = (raw) => {
        const value = (raw || '').trim();
        if (!value) return '';
        if (value.includes('://') || value.startsWith('//')) return '';
        if (value.toLowerCase().startsWith('javascript:')) return '';
        return value;
      };
      const next = safeNext(url.searchParams.get('next'));
      const loginLink = document.getElementById('loginLink');
      if (loginLink && next) {
        loginLink.href = `login.html?next=${encodeURIComponent(next)}`;
      }
      const session = await MHA_Auth.getSession();
      if (session) window.location.href = next || 'index.html';
    })();

    async function handleSignup(e) {
      e.preventDefault();
      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const btn = document.getElementById('submitBtn');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const displayName = document.getElementById('displayName').value.trim();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const data = await MHA_Auth.signUp(email, password, displayName);
        const url = new URL(window.location.href);
        const rawNext = url.searchParams.get('next');
        const next = (rawNext && !rawNext.includes('://') && !rawNext.startsWith('//')) ? rawNext : '';

        if (data.session) {
          window.location.href = next || 'index.html';
        } else {
          const loginUrl = next ? `login.html?next=${encodeURIComponent(next)}` : 'login.html';
          successEl.innerHTML = `Registration complete. Check your email and click the confirmation link. Then return to <a href="${loginUrl}" style="color: var(--accent-blue);">login</a>.`;
          successEl.style.display = 'block';
          document.getElementById('signupForm').style.display = 'none';
        }
      } catch (err) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(err, 'signup');
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    }
  </script>
</body>
</html>
