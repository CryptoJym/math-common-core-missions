<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Up | Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --line: rgba(77, 202, 239, 0.28);
      --line-soft: rgba(255, 255, 255, 0.13);
      --blue: #4cc9f0;
      --purple: #7b2cbf;
      --gold: #ffd700;
      --green: #00ff88;
      --red: #ff4444;
      --text: #e7f0ff;
      --muted: #96aac9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(123, 44, 191, 0.22) 0%, transparent 44%),
        radial-gradient(circle at 88% 88%, rgba(76, 201, 240, 0.2) 0%, transparent 44%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.04) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 50% 45%, #000 34%, transparent 88%);
      pointer-events: none;
      z-index: -1;
    }

    .auth-shell {
      width: min(470px, 100%);
    }

    .auth-card {
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(155deg, rgba(10, 18, 32, 0.9), rgba(13, 19, 33, 0.92));
      box-shadow: 0 20px 42px rgba(2, 8, 16, 0.5);
      padding: 30px 24px;
      backdrop-filter: blur(10px);
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.75rem;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255, 215, 0, 0.25);
    }

    .brand p {
      margin-top: 8px;
      color: var(--blue);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .auth-error,
    .auth-success {
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
      font-size: 0.95rem;
    }

    .auth-error {
      border: 1px solid rgba(255, 68, 68, 0.6);
      background: rgba(255, 68, 68, 0.1);
      color: var(--red);
    }

    .auth-success {
      border: 1px solid rgba(0, 255, 136, 0.5);
      background: rgba(0, 255, 136, 0.08);
      color: var(--green);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: 11px;
      background: rgba(4, 8, 15, 0.78);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      padding: 11px 12px;
    }

    .field input:focus {
      outline: none;
      border-color: rgba(0, 255, 136, 0.64);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
    }

    .field input::placeholder {
      color: var(--muted);
    }

    .auth-btn {
      width: 100%;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.76rem;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      margin-top: 8px;
      background: linear-gradient(135deg, #0ce08a, #00ff88);
      color: #04110a;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.24);
    }

    .auth-btn:hover {
      transform: translateY(-1px);
    }

    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .auth-links {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }

    .auth-links a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <h1>Create Your Account</h1>
        <p>Start In Under A Minute</p>
      </div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="field">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" placeholder="How should we call you?" required minlength="2" maxlength="30">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Secure Access Key</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="field">
          <label for="confirmPassword">Validate Key</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required minlength="6">
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">Create Account</button>
      </form>

      <div class="auth-links">
        <p>Already have an account? <a id="loginLink" href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const url = new URL(window.location.href);
      const safeNext = (raw) => {
        const value = (raw || '').trim();
        if (!value) return '';
        if (value.includes('://') || value.startsWith('//')) return '';
        if (value.toLowerCase().startsWith('javascript:')) return '';
        return value;
      };
      const next = safeNext(url.searchParams.get('next'));
      const loginLink = document.getElementById('loginLink');
      if (loginLink && next) {
        loginLink.href = `login.html?next=${encodeURIComponent(next)}`;
      }
      const session = await MHA_Auth.getSession();
      if (session) window.location.href = next || 'index.html';
    })();

    async function handleSignup(e) {
      e.preventDefault();
      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const btn = document.getElementById('submitBtn');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const displayName = document.getElementById('displayName').value.trim();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const data = await MHA_Auth.signUp(email, password, displayName);
        const url = new URL(window.location.href);
        const rawNext = url.searchParams.get('next');
        const next = (rawNext && !rawNext.includes('://') && !rawNext.startsWith('//')) ? rawNext : '';

        if (data.session) {
          window.location.href = next || 'index.html';
        } else {
          const loginUrl = next ? `login.html?next=${encodeURIComponent(next)}` : 'login.html';
          successEl.innerHTML = `Registration complete. Check your email and click the confirmation link. Then return to <a href="${loginUrl}" style="color: var(--blue);">login</a>.`;
          successEl.style.display = 'block';
          document.getElementById('signupForm').style.display = 'none';
        }
      } catch (err) {
        errorEl.textContent = MHA_Auth.getFriendlyAuthMessage(err, 'signup');
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
