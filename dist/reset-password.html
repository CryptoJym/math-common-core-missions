<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Up | Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --line: rgba(77, 202, 239, 0.32);
      --line-soft: rgba(255, 255, 255, 0.14);
      --blue: #4cc9f0;
      --gold: #ffd700;
      --green: #00ff88;
      --red: #ff4444;
      --text: #e7f0ff;
      --muted: #96aac9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(123, 44, 191, 0.2) 0%, transparent 42%),
        radial-gradient(circle at 90% 90%, rgba(76, 201, 240, 0.2) 0%, transparent 42%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 255, 136, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 45%, #000 35%, transparent 88%);
      pointer-events: none;
      z-index: -1;
    }

    .auth-shell {
      width: min(460px, 100%);
    }

    .auth-card {
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(155deg, rgba(10, 18, 32, 0.9), rgba(13, 19, 33, 0.92));
      box-shadow: 0 20px 42px rgba(2, 8, 16, 0.5);
      padding: 30px 24px;
      backdrop-filter: blur(10px);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.7rem;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255, 215, 0, 0.25);
    }

    .brand p {
      margin-top: 8px;
      color: var(--blue);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .auth-error,
    .auth-success,
    .auth-info {
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: none;
      font-size: 0.95rem;
    }

    .auth-error {
      border: 1px solid rgba(255, 68, 68, 0.6);
      background: rgba(255, 68, 68, 0.1);
      color: var(--red);
    }

    .auth-success {
      border: 1px solid rgba(0, 255, 136, 0.5);
      background: rgba(0, 255, 136, 0.08);
      color: var(--green);
    }

    .auth-info {
      border: 1px solid rgba(76, 201, 240, 0.45);
      background: rgba(76, 201, 240, 0.09);
      color: var(--blue);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: 11px;
      background: rgba(4, 8, 15, 0.78);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      padding: 11px 12px;
    }

    .field input:focus {
      outline: none;
      border-color: rgba(0, 255, 136, 0.64);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
    }

    .field input::placeholder {
      color: var(--muted);
    }

    .auth-btn {
      width: 100%;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.76rem;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      margin-top: 8px;
      background: linear-gradient(135deg, #0ce08a, #00ff88);
      color: #04110a;
      box-shadow: 0 0 14px rgba(0, 255, 136, 0.24);
    }

    .auth-btn:hover {
      transform: translateY(-1px);
    }

    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .auth-links {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
    }

    .auth-links a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <h1>Reset Password</h1>
        <p>Update Your Access Key</p>
      </div>

      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>
      <div class="auth-info" id="authInfo"></div>

      <form id="resetForm" onsubmit="handleResetPassword(event)">
        <div class="field">
          <label for="password">New Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your new password" required minlength="6">
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">Save New Password</button>
      </form>

      <div class="auth-links">
        <p>Back to <a href="login.html">login</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let _recoveryReady = false;

    function setVisible(el, msg) {
      if (!el) return;
      if (!msg) {
        el.style.display = 'none';
        el.textContent = '';
        return;
      }
      el.textContent = msg;
      el.style.display = 'block';
    }

    (async () => {
      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const infoEl = document.getElementById('authInfo');
      const form = document.getElementById('resetForm');

      const redirectState = await MHA_Auth.processAuthRedirect();
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const hasRecoverySignal = Boolean(
        redirectState?.recovery ||
        hashParams.get('type') === 'recovery' ||
        new URL(window.location.href).searchParams.get('type') === 'recovery'
      );

      if (redirectState.error) {
        setVisible(errorEl, MHA_Auth.getFriendlyAuthMessage(redirectState.error, 'reset_update'));
      }

      MHA_Auth.clearAuthRedirectParams();

      let session = await MHA_Auth.getSession();
      if (!session && hasRecoverySignal) {
        await new Promise((resolve) => setTimeout(resolve, 450));
        session = await MHA_Auth.getSession();
      }

      if (!hasRecoverySignal || !session) {
        _recoveryReady = false;
        setVisible(infoEl, 'Open this page from the password reset email link. If the link expired, request a new one from login.');
        form.style.display = 'none';
        return;
      }

      _recoveryReady = true;
      setVisible(infoEl, 'Set a new password, then sign in again.');
    })();

    async function handleResetPassword(e) {
      e.preventDefault();

      const errorEl = document.getElementById('authError');
      const successEl = document.getElementById('authSuccess');
      const infoEl = document.getElementById('authInfo');
      const btn = document.getElementById('submitBtn');
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      setVisible(errorEl, '');
      setVisible(successEl, '');

      if (!_recoveryReady) {
        setVisible(errorEl, 'Recovery link is missing or expired. Request a new reset email from login.');
        return;
      }

      if (password !== confirmPassword) {
        setVisible(errorEl, 'Passwords do not match.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving...';
      try {
        const { error } = await MHA_Auth.getSupabase().auth.updateUser({ password });
        if (error) throw error;

        try {
          await MHA_Auth.getSupabase().auth.signOut({ scope: 'local' });
        } catch (_) {
          // Ignore local sign-out errors.
        }

        setVisible(infoEl, '');
        setVisible(successEl, 'Password updated. Redirecting to login...');
        setTimeout(() => {
          window.location.href = 'login.html?reset=1';
        }, 900);
      } catch (err) {
        setVisible(errorEl, MHA_Auth.getFriendlyAuthMessage(err, 'reset_update'));
        btn.disabled = false;
        btn.textContent = 'Save New Password';
      }
    }
  </script>
</body>
</html>
